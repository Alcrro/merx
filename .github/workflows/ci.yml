name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build · Lint · Type-check · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - name: Build packages
        run: npm run build

      - name: Type-check
        run: npm run type-check

      - name: Lint
        # Non-blocking until the existing lint debt (~500 errors) is paid down
        continue-on-error: true
        run: npm run lint -- --continue

      - name: Test
        run: npm test
